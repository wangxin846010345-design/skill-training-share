.kpi-card.green .value { color: var(--green-6); }

.section {

.section-title {

}
.section-title .icon { font-size: 20px; }
.charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.chart-full { width: 100%; }
.chart-box { position: relative; }
.chart-box canvas { max-height: 320px; }
.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.data-table th {
  background: var(--gray-2); color: var(--gray-8); font-weight: 600;
  padding: 10px 12px; text-align: left; border-bottom: 2px solid var(--gray-3);
}
.data-table td { padding: 8px 12px; border-bottom: 1px solid var(--gray-2); }
.data-table tr:hover td { background: var(--arcoblue-1); }
.data-table .num { text-align: right; font-variant-numeric: tabular-nums; }
.data-table .pct { color: var(--gray-6); font-size: 12px; }
.tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 500; }
.tag-red { background: #FFECE8; color: var(--red-6); }
.tag-orange { background: #FFF7E8; color: var(--orange-6); }
.tag-green { background: #E8FFEA; color: var(--green-6); }
.tag-blue { background: var(--arcoblue-1); color: var(--arcoblue-6); }
.tag-purple { background: #F5E8FF; color: var(--purple-6); }
.tag-cyan { background: #E8FFFB; color: var(--cyan-6); }
.insight-box {
  background: var(--arcoblue-1); border-left: 4px solid var(--arcoblue-6);
  padding: 16px 20px; border-radius: 0 var(--border-radius) var(--border-radius) 0;
  margin: 16px 0; font-size: 14px; line-height: 1.8;

.insight-box.warning { background: #FFF7E8; border-left-color: var(--orange-6); }
.insight-box.danger { background: #FFECE8; border-left-color: var(--red-6); }
.insight-box .insight-title { font-weight: 600; margin-bottom: 4px; }
.progress-bar { height: 8px; background: var(--gray-2); border-radius: 4px; overflow: hidden; }
.progress-bar .fill { height: 100%; border-radius: 4px; transition: width 0.6s ease; }
.report-footer { text-align: center; padding: 32px 0; color: var(--gray-5); font-size: 12px; }
@media (max-width: 768px) {
  .kpi-grid { grid-template-columns: repeat(2, 1fr); }

function generateTimeInsight(DATA) {
  const wd = DATA.weekdayDist;
  const maxWd = wd.reduce((a,b) => b.count > a.count ? b : a, wd[0]);
  const hd = DATA.hourlyDist.filter(h => h.count > 0);
  const maxH = hd.reduce((a,b) => b.count > a.count ? b : a, hd[0] || {hour:0,count:0});
  return '工作日中最活跃的是' + maxWd.name + '(' + maxWd.count + '次操作)；操作高峰时段为' + maxH.hour + ':00(' + maxH.count + '次)；加班操作' + DATA.overtime.total + '次占' + DATA.overtime.pct + '%。';
}

function generateCategoryRows(DATA) {
  return _catOrder.map((cat, i) => {
    const count = DATA.categoryCounts[cat] || 0;
    const pct = (count / Math.max(O.totalOps, 1) * 100).toFixed(1);
    const paths = DATA.categoryPathCounts[cat] || {};
    const topPaths = Object.entries(paths).sort((a,b) => b[1]-a[1]).slice(0,3);
    const subInfo = topPaths.map(([p,c]) => (_pathLabels[p]||p)+'('+c+')').join('、');
    return '<tr><td><span class="tag ' + _catColors[i] + '">' + cat + '</span></td><td style="font-weight:600">' + count.toLocaleString() + '</td><td>' + pct + '%</td><td style="font-size:12px;color:var(--gray-6)">' + subInfo + '</td></tr>';
  }).join('');
}

function generatePathDetailRows(DATA) {
  return DATA.pathDetailRows.map(row => {
    const catIdx = _catOrder.indexOf(row.category);
    const pct = (row.count / Math.max(O.totalOps, 1) * 100).toFixed(2);
    return '<tr><td><span class="tag ' + (_catColors[catIdx] || 'tag-blue') + '">' + row.category + '</span></td><td>' + row.path + '</td><td style="font-weight:600">' + row.count.toLocaleString() + '</td><td>' + pct + '%</td></tr>';
  }).join('');
}
